<!DOCTYPE html>
<html lang="en">
<!--Configure settings here-->
<script>
    const CONFIG = {
        colors_url: "http://192.168.1.51:5000/api/colors",
        current_race_url: "http://192.168.1.51:5000/api/current_race",

        // Alternate URLs for development
        // colors_url: "http://localhost:4192/colors.json",
        // current_race_url: "http://localhost:4192/current_race.json",

        pollingPeriodMilliseconds: 400,
        popupActiveMilliseconds: 10000,
        alignRight: false,
        alignTop: true,
    };
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Skating Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
          rel="stylesheet">
</head>
<style>

    * {
        font-family: "Open Sans", Helvetica, sans-serif;
        --primary-background: #145dae;
        --secondary-background: #424547;

        --rank-foreground: white;
        --rank-background: var(--primary-background);
    }

    body {
        background-color: transparent;
        color: white;
    }

    #skaters_list {
        position: absolute;
        margin: 0 1vmin 1vmin;
    }

    #current_title {
        display: flex;
    }

    #current_code {
        background-color: var(--primary-background);
        padding: 0.8vmin;
        align-content: center;
        vertical-align: center;
        border-radius: 4px 0 0 4px;
    }

    #current_name {
        border-radius: 0 4px 4px 0;
        background: var(--secondary-background);
        padding: 0.8vmin;

    }

    #current_skaters {

    }

    .skater_element {
        display: flex;
        margin-top: 1vmin;
    }

    .skater_number {
        padding: 0.8vmin;
        color: var(--rank-foreground);
        background-color: var(--rank-background);
        border-radius: 4px 0 0 12px;
        display: flex;
        align-items: center;
    }

    .skater_name {
        padding: 0.4vmin;
        white-space: nowrap;
        display: flex;
        align-items: center;
        background-color: var(--secondary-background);
    }

    .skater_time {
        padding: 0.4vmin;
        background-color: var(--secondary-background);
        border-radius: 0 4px 4px 0;
        text-align: right;
        display: flex;
        align-items: center;
        justify-content: right;
    }

    #results_box {
        position: absolute;
        width: 60vw;
        margin-left: 30vw;
        margin-right: 30vw;
        margin-top: 20vh;
        font-size: xx-large;
        opacity: 0;
    }

    #results_title_bar {
        display: flex;
    }

    #results_title_header {
        background-color: var(--primary-background);
        padding: 1vmin;
        border-radius: 8px 8px 0 0;
        text-align: center;
        font-weight: bold;
    }

    #results_title_code {
        background-color: var(--secondary-background);
        padding: 1vmin;
        border-radius: 0 0 0 8px;
    }

    #results_title_name {
        background-color: var(--secondary-background);
        padding: 1vmin;
        width: 100%;
        text-align: right;
        border-radius: 0 0 8px 0;
    }

    #results_skater_list {
        font-size: x-large;
    }

    .results_skater_number {
        padding: 0.8vmin;
        color: var(--rank-foreground);
        background-color: var(--rank-background);
        border-radius: 4px 0 0 4px;
    }

    .results_skater_name {
        padding: 0.8vmin;
        background-color: var(--secondary-background);
        width: 100%;
    }

    .results_skater_time {
        padding: 0.8vmin;
        background-color: var(--primary-background);
        border-radius: 0 4px 4px 0;
    }

    .results_skater {
        display: flex;
        width: 100%;
        margin-top: 1vmin;
    }
</style>
<body>
<div id="skaters_list">
    <div id="current_title">
        <div id="current_code"></div>
        <div id="current_name"></div>
    </div>
    <div id="current_skaters"></div>
</div>
<div id="results_box">
    <div id="results_title_header">
        Unofficial Results - Résultats non officiels
    </div>
    <div id="results_title_bar">
        <div id="results_title_code">
            35B
        </div>
        <div id="results_title_name">
            3 Laps Mixte (85m)
        </div>
    </div>
    <div id="results_skater_list">
        <div class="results_skater">
            <div class="results_skater_number">1</div>
            <div class="results_skater_name">TEST, Skater</div>
            <div class="results_skater_time">48.32</div>
        </div>
    </div>
</div>
</body>
<!--suppress JSUnresolvedReference -->
<script type="module">
    // Fetch helmet colours
    let helmet_colours = await fetch(CONFIG.colors_url + "?t=" + Date.now())
        .then((response) => response.json())
        .then((data) => {
            if (data.length !== 0) {
                return data;
            }
        });

    // Function to move results to internal type, sorting by skater rank
    // Insertion sort is plenty fast for this
    function sort_skaters(results_in) {
        let skater_results = [];
        for (const skater of results_in) {
            let i = 0;
            while (i < skater_results.length && skater_results[i].rank < skater.rank) {
                i++;
            }

            let new_skater_entry = {};
            new_skater_entry.rank = skater.rank;
            new_skater_entry.name = skater.name;
            let intervals = skater.lap_intervals;
            new_skater_entry.recent_lap = intervals[intervals.length - 1];
            new_skater_entry.display_time = skater.display_time;

            skater_results.splice(i, 0, new_skater_entry);
        }
        return skater_results;
    }

    let last_race_json = "{}";

    function update() {
        // Correctly position skater table
        let skater_list = document.getElementById("skaters_list");
        if (CONFIG.alignRight) {
            skater_list.style.right = "0";
        }
        if (!CONFIG.alignTop) {
            skater_list.style.bottom = "0";
        }

        // Fetch current race data. The timestamp is added to avoid browser caching.
        fetch(CONFIG.current_race_url + "?t=" + Date.now())
            .then((response) => response.json())
            .then((data) => {
                const current_skaters = document.getElementById("current_skaters");
                current_skaters.innerHTML = '';
                if (data.length === 0) {
                    return;
                }

                // Update header
                document.getElementById("current_code").innerText = data.current_race_id;
                document.getElementById("current_name").innerText = data.race_description;

                let skater_list = sort_skaters(data.results);

                // Update skaters list
                for (const skater of skater_list) {
                    const skaterNode = document.createElement("div");
                    skaterNode.classList.add("skater_element")

                    const skaterNumber = document.createElement("div");
                    skaterNumber.classList.add("skater_number");
                    skaterNumber.innerText = skater.rank;
                    skaterNumber.style.setProperty("--rank-foreground", helmet_colours[skater.rank.toString()].fg);
                    skaterNumber.style.setProperty("--rank-background", helmet_colours[skater.rank.toString()].bg);

                    const skaterName = document.createElement("div");
                    skaterName.classList.add("skater_name");
                    skaterName.innerText = skater.name;

                    const skaterTime = document.createElement("div");
                    skaterTime.classList.add("skater_time");
                    skaterTime.innerText = skater.recent_lap;

                    skaterNode.appendChild(skaterNumber);
                    skaterNode.appendChild(skaterName);
                    skaterNode.appendChild(skaterTime);

                    current_skaters.appendChild(skaterNode)
                }

                // Make all name and number boxes the same width
                const skater_name_elements = document.getElementsByClassName("skater_name");
                let max_name_width = 0;
                for (const skater_name of skater_name_elements) {
                    if (skater_name.clientWidth > max_name_width) {
                        max_name_width = skater_name.clientWidth;
                    }
                }
                for (let skater_name of skater_name_elements) {
                    skater_name.style.width = max_name_width.toString() + 'px';
                }
                const skater_time_elements = document.getElementsByClassName("skater_time");
                let max_time_width = 0;
                for (const skater_time of skater_time_elements) {
                    if (skater_time.clientWidth > max_time_width) {
                        max_time_width = skater_time.clientWidth;
                    }
                }
                for (let skater_time of skater_time_elements) {
                    skater_time.style.width = max_time_width.toString() + 'px';
                }

                // If new results, update and show results popup
                // Results are new if either the race ID changes or the rising edge of the all_finished property
                const is_new_race_id = last_race_json !== "{}" && last_race_json.current_race_id !== data.current_race_id;
                const current_race_just_finished = data.all_finished && !last_race_json.all_finished;
                if (is_new_race_id || current_race_just_finished) {
                    document.getElementById("results_title_code").innerText = last_race_json.current_race_id;
                    document.getElementById("results_title_name").innerText = last_race_json.race_description;

                    const skaterList = document.getElementById("results_skater_list");
                    skaterList.innerText = "";

                    let past_skaters = sort_skaters(last_race_json.results);
                    for (const skater of past_skaters) {
                        const skaterNode = document.createElement("div");
                        skaterNode.classList.add("results_skater")

                        const skaterNumber = document.createElement("div");
                        skaterNumber.classList.add("results_skater_number");
                        skaterNumber.innerText = skater.rank;
                        skaterNumber.style.setProperty("--rank-foreground", helmet_colours[skater.rank.toString()].fg);
                        skaterNumber.style.setProperty("--rank-background", helmet_colours[skater.rank.toString()].bg);

                        const skaterName = document.createElement("div");
                        skaterName.classList.add("results_skater_name");
                        skaterName.innerText = skater.name;

                        const skaterTime = document.createElement("div");
                        skaterTime.classList.add("results_skater_time");
                        skaterTime.innerText = skater.display_time;

                        skaterNode.appendChild(skaterNumber);
                        skaterNode.appendChild(skaterName);
                        skaterNode.appendChild(skaterTime);

                        skaterList.appendChild(skaterNode);
                    }

                    const skater_time_elements = document.getElementsByClassName("results_skater_time");
                    let max_time_width = 0;
                    for (const skater_time of skater_time_elements) {
                        if (skater_time.clientWidth > max_time_width) {
                            max_time_width = skater_time.clientWidth;
                        }
                    }
                    for (let skater_time of skater_time_elements) {
                        skater_time.style.width = max_time_width.toString() + 'px';
                    }

                    // Animate fade in then back out
                    document.getElementById("results_box").animate(
                        [
                            // 0% should be at 10% of the way through and 90%
                            {opacity: 0},
                            {opacity: 1},
                            {opacity: 1},
                            {opacity: 1},
                            {opacity: 1},
                            {opacity: 1},
                            {opacity: 1},
                            {opacity: 1},
                            {opacity: 1},
                            {opacity: 0}
                        ],
                        {duration: CONFIG.popupActiveMilliseconds}
                    );
                }

                last_race_json = data;
            })
            .catch(console.error);
    }

    update();
    (function loop() {
        setTimeout(() => {
            update()
            loop();
        }, CONFIG.pollingPeriodMilliseconds);
    })();
</script>
</html>
